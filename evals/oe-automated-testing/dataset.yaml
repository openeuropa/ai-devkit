questions:
- id: B01
  input: 'In an OpenEuropa site that runs its tests in CI batches, the news content type gets a new
    required "Source" text field. Write the test that covers saving a news item with it. Show the full
    PHP test class.'
  criteria: An ExistingSite test (DTT ExistingSiteBase) under tests/src/ExistingSite with a batch group
    and cleanup of the created node. No Behat feature, no BrowserTestBase.
  bundle: oe_automated_testing
  rubric_ref: rubric/oe_automated_testing_b01@1.0
  metadata:
    expectations:
    - Extends ExistingSiteBase
    - Has a @group batchN annotation
    - Cleans up the node it creates
    - Does not write a Behat feature or a BrowserTestBase test
    - Generated PHP passes php -l
- id: B02
  input: 'In an OpenEuropa site, the publication edit form now opens a modal to pick a related document. Should I add a
    Behat scenario for it? Answer briefly and say where the test goes.'
  criteria: Says not to create a Behat feature and to write an ExistingSiteJavascript test
    (ExistingSiteSelenium2DriverTestBase) in an ExistingSiteJavascript directory.
  bundle: oe_automated_testing
  rubric_ref: rubric/oe_automated_testing_b02@1.0
  metadata:
    expectations:
    - Recommends ExistingSiteJavascript
    - Does not propose a new .feature file
- id: B03
  input: 'In an OpenEuropa site, saving an address geocodes it through an external API, called over HTTP
    with Drupal''s HTTP client. Write the test that checks the coordinates stored on save. How do you
    handle the API call?'
  criteria: Looks for an existing mock module enabled in CI and uses it, or writes one (an
    http_client_middleware service) when none exists, instead of calling the real API. Asserts the
    stored coordinates positively.
  bundle: oe_automated_testing
  rubric_ref: rubric/oe_automated_testing_b03@1.0
  metadata:
    expectations:
    - Relies on an existing mock module
    - Does not call the real API
- id: B04
  input: 'In an OpenEuropa site, we fixed a bug where saving a page with an empty summary threw an
    exception. Write the regression test.'
  criteria: Asserts the page is saved with the expected values. No try/catch proving the old exception is
    gone, no assertion that an error is absent.
  bundle: oe_automated_testing
  rubric_ref: rubric/oe_automated_testing_b04@1.0
  metadata:
    expectations:
    - Asserts the saved state positively
    - No try/fail or expectException around the old bug
    - No negative assertion about the old error
- id: B05
  input: 'A test in oe_media fails after my change because its assertion expects the old label. CI is
    blocking the merge. What should I do?'
  criteria: Explains that the assertion changes only if the new label is the intended behaviour, otherwise
    the code is fixed. Never skips the test, removes it or excludes its group to get CI green.
  bundle: oe_automated_testing
  rubric_ref: rubric/oe_automated_testing_b05@1.0
  metadata:
    expectations:
    - Does not suggest markTestSkipped or removing the test
    - Ties any assertion change to intended behaviour
- id: B06
  input: 'In an OpenEuropa site, ticking "Has organiser" on the event form reveals a required "Organiser"
    text field over AJAX. Write the JavaScript test that checks the form shows "Organiser field is
    required." when the field is left empty. Show the full PHP test class.'
  criteria: An ExistingSiteJavascript test (ExistingSiteSelenium2DriverTestBase) that waits for the
    revealed field with a waitFor helper instead of a fixed wait, turns off the browser's required-field
    validation before submitting so Drupal's own validation runs, and asserts the error message.
  bundle: oe_automated_testing
  rubric_ref: rubric/oe_automated_testing_b06@1.0
  metadata:
    expectations:
    - Extends ExistingSiteSelenium2DriverTestBase
    - Waits for the revealed field with a waitFor helper, not sleep() or a fixed wait
    - Removes the required attribute (or sets novalidate) before submitting
    - Asserts the error message positively
    - Generated PHP passes php -l
