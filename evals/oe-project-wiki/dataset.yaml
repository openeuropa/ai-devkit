questions:
- id: B01
  input: 'You are starting a ticket in an OpenEuropa repository that has a
    docs/wiki/index.md file. Describe, step by step, what you do before you
    begin reading or changing source code. Output in Markdown.'
  criteria: The agent reads docs/wiki/index.md first, then opens only the
    pages the index lists for the area it is about to touch, rather than
    reading the whole wiki or going straight to source.
  bundle: oe_project_wiki
  rubric_ref: rubric/oe_project_wiki_b01@1.0
  metadata:
    expectations:
    - Reads docs/wiki/index.md before source code
    - Opens only the pages relevant to the area being touched
    - Treats pages as facts but trusts code when they disagree
- id: B02
  input: 'During a ticket in an OpenEuropa repo you discovered a non-obvious
    reason behind an architectural choice that would save the next person an
    investigation. The ticket is JIRA-123. The repo uses docs/wiki/ (no
    kenkeep). What do you do at the end of the task? Output in Markdown, and
    end with a line in exactly this form: "Action: <proposed|wrote>", where
    "proposed" means you suggested the page without creating it and "wrote"
    means you created it yourself.'
  criteria: The agent proposes a wiki page or section (it does not write it
    unasked), in the decision/reference shape, records the ticket as an
    Origin provenance line, and proposes the index line pointing to it. It
    ends with the line "Action: proposed".
  bundle: oe_project_wiki
  rubric_ref: rubric/oe_project_wiki_b02@1.0
  metadata:
    expectations:
    - Proposes the page rather than writing it unasked
    - Places it in the right area folder with a `Type:` header (adr or decision)
    - Records JIRA-123 as an Origin provenance line, not load-bearing
    - Adds the index line that points to the new page
    - Ends with the verdict line "Action: proposed"
- id: B03
  input: 'You finished a ticket. The only things you produced were progress
    notes and the current ticket status. Should any of it go into the project
    wiki at docs/wiki/? Explain briefly. Output in Markdown, and end with a
    line in exactly this form: "Verdict: <wiki|not wiki>", where "not wiki"
    means none of it belongs in the wiki.'
  criteria: The agent recognises this is not durable (progress notes and
    ticket status fail the "would it save the next person an investigation"
    test) and declines to add it to the wiki, keeping it as transient issue
    notes instead. It ends with the line "Verdict: not wiki".
  bundle: oe_project_wiki
  rubric_ref: rubric/oe_project_wiki_b03@1.0
  metadata:
    expectations:
    - Declines to add progress notes or ticket status to the wiki
    - Explains the durability test
    - Keeps transient notes out of docs/wiki/
    - Ends with the verdict line "Verdict: not wiki"
