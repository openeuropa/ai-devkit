name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer cs-check
      - run: composer phpstan
      - run: vendor/bin/phpunit # includes the 200-line steering budget
      - run: vendor/bin/agent-skills-validator skills
      - run: composer evals # upstream's runner, with --root
  smoke-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: scripts/ci-smoke-install.sh
